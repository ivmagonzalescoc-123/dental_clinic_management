<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Odontogram</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="importmap">
{
  "imports": {
    "three": "../assets/vendor/three/build/three.module.js",
    "three/addons/": "../assets/vendor/three/examples/jsm/"
  }
}
</script>
  </head>
  <body>
    <div class="app">
      <aside class="panel">
        <header class="panel__header">
          <h1>Odontogram</h1>
        </header>

        <section class="section section--flat">
          <h2>Selection</h2>
          <div class="selected">
            <div class="selected__row">
              <span class="label">Tooth (FDI)</span>
              <strong id="selectedTooth">—</strong>
            </div>
            <div class="selected__row">
              <span class="label">Surface</span>
              <strong id="selectedSurface">—</strong>
            </div>
            <div class="selected__row">
              <span class="label">Applied code</span>
              <span id="statusSummary" class="pill">—</span>
            </div>
          </div>

          <h2 class="legend-heading">Chart legend</h2>
          <div id="legendGrid" class="legend-grid"></div>

          <div class="action-row">
            <button class="btn btn--ghost" id="clearSurface" type="button">Clear surface</button>
            <button class="btn btn--ghost" id="clearTooth" type="button">Clear tooth</button>
          </div>

          <label class="label" for="toothComment" style="display:block;margin-top:12px;">Tooth Comment/Notes</label>
          <textarea id="toothComment" class="toothComment" rows="3" placeholder="Notes for the selected tooth..."></textarea>

          <button class="btn btn--reset" id="resetView" type="button" style="display:none;">Reset 3D View</button>
        </section>

        <footer class="panel__footer">
          <small id="viewHint">Click a tooth on the arch, then pick a surface in the bar above the chart.</small>
        </footer>
      </aside>

      <section class="workspace">
        <div class="view-tabs" role="tablist" aria-label="Chart view">
          <button type="button" id="viewTabChart" class="view-tab is-active" role="tab" aria-selected="true">2D Chart</button>
          <button type="button" id="viewTab3d" class="view-tab" role="tab" aria-selected="false">3D Preview</button>
        </div>
        <div class="workspace__body">
          <div id="chartPane" class="chart-pane" role="tabpanel">
            <div class="chart-pane__stack">
              <div id="chartToothDetail" class="chart-tooth-detail"></div>
              <div id="odontogram" class="odontogram odontogram--arch"></div>
            </div>
          </div>
          <div id="viewport3d" class="viewport-3d is-hidden" role="tabpanel">
            <div id="loadOverlay" class="load-overlay is-hidden" aria-live="polite" aria-busy="true">
              <div class="load-overlay__panel">
                <p class="load-overlay__label" id="loadLabel">Loading 3D models…</p>
                <div class="load-overlay__track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                  <div class="load-overlay__bar" id="loadBar"></div>
                </div>
                <p class="load-overlay__pct" id="loadPct">0%</p>
              </div>
            </div>
            <div id="modelStatus" class="model-status is-hidden"></div>
            <div id="isolationStatus" class="isolation-status is-hidden" aria-live="polite"></div>
            <canvas id="c"></canvas>
          </div>
        </div>
      </section>
    </div>
    <script type="module" src="./main.js?v=20250606"></script>
  </body>
</html>
