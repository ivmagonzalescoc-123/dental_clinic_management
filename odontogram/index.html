<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Odontogram</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="./style.css" />
    <script type="importmap">
{
  "imports": {
    "three": "../assets/vendor/three/build/three.module.js",
    "three/addons/": "../assets/vendor/three/examples/jsm/"
  }
}
</script>
  </head>
  <body>
    <div class="app">
      <button type="button" class="panel-toggle" id="panelToggle" aria-label="Toggle controls panel" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0"/></svg>
        <span>Controls</span>
      </button>
      <aside class="panel">
        <header class="panel__header">
          <h1>Odontogram</h1>
        </header>

        <section class="section section--flat">
          <h2>Selection</h2>
          <div class="selected">
            <div class="selected__row">
              <span class="label">Tooth (FDI)</span>
              <strong id="selectedTooth">—</strong>
            </div>
            <div class="selected__row">
              <span class="label">Surface</span>
              <strong id="selectedSurface">—</strong>
            </div>
            <div class="selected__row">
              <span class="label">Applied code</span>
              <span id="statusSummary" class="pill">—</span>
            </div>
          </div>

          <h2 class="legend-heading">Chart legend</h2>
          <div id="legendGrid" class="legend-grid"></div>

          <div class="action-row">
            <button class="btn btn--ghost" id="clearSurface" type="button">Clear surface</button>
            <button class="btn btn--ghost" id="clearTooth" type="button">Clear tooth</button>
          </div>

          <label class="label" for="toothComment" style="display:block;margin-top:12px;">Tooth Comment/Notes</label>
          <textarea id="toothComment" class="toothComment" rows="3" placeholder="Notes for the selected tooth..."></textarea>

          <button class="btn btn--reset" id="resetView" type="button" style="display:none;">Reset 3D View</button>
        </section>

        <footer class="panel__footer">
          <small id="viewHint">Click a tooth on the arch, then pick a surface in the bar above the chart.</small>
        </footer>
      </aside>

      <section class="workspace">
        <div class="view-tabs" role="tablist" aria-label="Chart view">
          <button type="button" id="viewTabChart" class="view-tab is-active" role="tab" aria-selected="true">2D Chart</button>
          <button type="button" id="viewTab3d" class="view-tab" role="tab" aria-selected="false">3D Preview</button>
          <button type="button" id="printChartBtn" class="view-tab view-tab--print" title="Print 2D chart">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px;"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v8H6v-8z"/></svg>Print
          </button>
        </div>
        <div class="workspace__body">
          <div id="chartPane" class="chart-pane" role="tabpanel">
            <div class="chart-pane__stack">
              <div id="chartToothDetail" class="chart-tooth-detail"></div>
              <div id="odontogram" class="odontogram odontogram--arch"></div>
            </div>
          </div>
          <div id="viewport3d" class="viewport-3d is-hidden" role="tabpanel">
            <div id="loadOverlay" class="load-overlay is-hidden" aria-live="polite" aria-busy="true">
              <div class="load-overlay__panel">
                <p class="load-overlay__label" id="loadLabel">Loading 3D models…</p>
                <div class="load-overlay__track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                  <div class="load-overlay__bar" id="loadBar"></div>
                </div>
                <p class="load-overlay__pct" id="loadPct">0%</p>
              </div>
            </div>
            <div id="modelStatus" class="model-status is-hidden"></div>
            <button type="button" id="exitIsolationBtn" class="isolation-exit is-hidden" aria-label="Back to all teeth">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
              All teeth
            </button>
            <div id="isolationStatus" class="isolation-status is-hidden" aria-live="polite"></div>
            <canvas id="c"></canvas>
          </div>
        </div>
      </section>
    </div>
    <script type="module" src="./main.js?v=20260930b"></script>
    <script>
    (function() {
      var toggle = document.getElementById('panelToggle');
      var panel = document.querySelector('.panel');
      if (!toggle || !panel) return;

      var backdrop = document.createElement('div');
      backdrop.className = 'panel-backdrop';
      document.body.appendChild(backdrop);

      function openPanel() {
        panel.classList.add('is-open');
        backdrop.classList.add('is-visible');
        toggle.classList.add('is-open');
        toggle.setAttribute('aria-expanded', 'true');
      }
      function closePanel() {
        panel.classList.remove('is-open');
        backdrop.classList.remove('is-visible');
        toggle.classList.remove('is-open');
        toggle.setAttribute('aria-expanded', 'false');
      }
      function togglePanel() {
        if (panel.classList.contains('is-open')) closePanel();
        else openPanel();
      }

      toggle.addEventListener('click', togglePanel);
      backdrop.addEventListener('click', closePanel);

      /* Auto-close panel when a tooth is clicked (desktop-like UX on mobile) */
      var chart = document.getElementById('odontogram');
      if (chart) {
        chart.addEventListener('click', function() {
          if (window.innerWidth <= 860 && panel.classList.contains('is-open')) {
            closePanel();
          }
        });
      }
    })();
    </script>
  </body>
</html>
