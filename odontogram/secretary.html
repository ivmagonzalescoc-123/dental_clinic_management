<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odontogram</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #f8f9fa;
        }
        .odontogram-container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }
        .odontogram {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
        }
        .odontogram h5 {
            margin: 0 0 15px 0;
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }
        .teeth-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }
        .teeth-row {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }
        .teeth-row label {
            font-size: 11px;
            color: #666;
            margin-bottom: 4px;
            grid-column: 1 / -1;
        }
        .tooth {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
            background: #f0f0f0;
            border: 2px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            user-select: none;
            font-size: 12px;
            font-weight: 600;
            color: #333;
            transition: all 0.2s;
        }
        .tooth:hover {
            background: #e8e8e8;
            border-color: #bbb;
        }
        .tooth.selected {
            background: #0d6efd;
            color: white;
            border-color: #0d6efd;
            box-shadow: 0 0 8px rgba(13, 110, 253, 0.4);
        }
        .teeth-label {
            font-size: 10px;
            color: #999;
            text-align: center;
            margin: 8px 0;
            font-weight: 600;
        }
        .tooth-status {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #eee;
            font-size: 12px;
        }
        .tooth-status-item {
            flex: 1;
        }
        .tooth-status-item strong {
            display: block;
            color: #333;
            margin-bottom: 4px;
        }
        .tooth-condition {
            width: 100%;
            padding: 6px;
            font-size: 12px;
            border: 1px solid #ddd;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="odontogram-container">
        <div class="odontogram">
            <h5>Tooth Chart (Odontogram)</h5>
            
            <!-- Upper Teeth -->
            <div class="teeth-row">
                <label>Upper Teeth (Permanent)</label>
                <div class="tooth" data-tooth="18">18</div>
                <div class="tooth" data-tooth="17">17</div>
                <div class="tooth" data-tooth="16">16</div>
                <div class="tooth" data-tooth="15">15</div>
                <div class="tooth" data-tooth="14">14</div>
                <div class="tooth" data-tooth="13">13</div>
                <div class="tooth" data-tooth="12">12</div>
                <div class="tooth" data-tooth="11">11</div>
            </div>

            <!-- Upper Right to Left -->
            <div class="teeth-row">
                <div class="tooth" data-tooth="21">21</div>
                <div class="tooth" data-tooth="22">22</div>
                <div class="tooth" data-tooth="23">23</div>
                <div class="tooth" data-tooth="24">24</div>
                <div class="tooth" data-tooth="25">25</div>
                <div class="tooth" data-tooth="26">26</div>
                <div class="tooth" data-tooth="27">27</div>
                <div class="tooth" data-tooth="28">28</div>
            </div>

            <div class="teeth-label">↑ Upper Teeth | Lower Teeth ↓</div>

            <!-- Lower Right to Left -->
            <div class="teeth-row">
                <div class="tooth" data-tooth="38">38</div>
                <div class="tooth" data-tooth="37">37</div>
                <div class="tooth" data-tooth="36">36</div>
                <div class="tooth" data-tooth="35">35</div>
                <div class="tooth" data-tooth="34">34</div>
                <div class="tooth" data-tooth="33">33</div>
                <div class="tooth" data-tooth="32">32</div>
                <div class="tooth" data-tooth="31">31</div>
            </div>

            <!-- Lower Teeth -->
            <div class="teeth-row">
                <label>Lower Teeth (Permanent)</label>
                <div class="tooth" data-tooth="48">48</div>
                <div class="tooth" data-tooth="47">47</div>
                <div class="tooth" data-tooth="46">46</div>
                <div class="tooth" data-tooth="45">45</div>
                <div class="tooth" data-tooth="44">44</div>
                <div class="tooth" data-tooth="43">43</div>
                <div class="tooth" data-tooth="42">42</div>
                <div class="tooth" data-tooth="41">41</div>
            </div>

            <div class="tooth-status">
                <div class="tooth-status-item">
                    <strong>Selected Tooth #</strong>
                    <input type="text" id="selectedToothDisplay" class="tooth-condition" readonly>
                </div>
                <div class="tooth-status-item">
                    <strong>Condition/Notes</strong>
                    <input type="text" id="toothCondition" class="tooth-condition" placeholder="Healthy, Cavity, etc.">
                </div>
            </div>
        </div>
    </div>

    <script>
        // Track selected teeth
        let selectedToothData = {};
        
        // Initialize teeth click handlers
        document.querySelectorAll('.tooth').forEach(tooth => {
            tooth.addEventListener('click', function() {
                const toothNum = this.dataset.tooth;
                
                // Toggle selection
                if (this.classList.contains('selected')) {
                    this.classList.remove('selected');
                    document.getElementById('selectedToothDisplay').value = '';
                    document.getElementById('toothCondition').value = '';
                    delete selectedToothData[toothNum];
                } else {
                    // Remove previous selection
                    document.querySelectorAll('.tooth.selected').forEach(t => {
                        t.classList.remove('selected');
                    });
                    
                    this.classList.add('selected');
                    document.getElementById('selectedToothDisplay').value = toothNum;
                    document.getElementById('toothCondition').value = selectedToothData[toothNum] || '';
                }
            });
        });
        
        // Save condition when text changes
        document.getElementById('toothCondition').addEventListener('change', function() {
            const selectedTooth = document.querySelector('.tooth.selected');
            if (selectedTooth) {
                const toothNum = selectedTooth.dataset.tooth;
                selectedToothData[toothNum] = this.value;
            }
        });
        
        // Export odontogram data
        function getOdontogramData() {
            return selectedToothData;
        }
    </script>
</body>
</html>
